plugins {
    id 'java'
    id 'org.springframework.boot' version '2.6.3'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'war'
}

sourceCompatibility = JavaVersion.VERSION_11

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation project(':gallery-core')

    // https://mvnrepository.com/artifact/com.google.gcm/gcm-server
    implementation 'com.google.gcm:gcm-server:1.0.0'
  implementation 'com.amazonaws:aws-java-sdk-s3:1.12.147'
    // https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    implementation 'javax.servlet:jstl'
    providedRuntime 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'org.apache.tiles:tiles-jsp:3.0.8'
    implementation 'me.paulschwarz:spring-dotenv:2.4.1'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'mysql:mysql-connector-java'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootWar {
    mainClass = 'com.gallery.Application'
    archiveFileName = 'GalleryStaff.war'   // Tomcat context: /GalleryStaff
    archiveVersion = '0.0.0'
}
jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
